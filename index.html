<head>
<meta charset="utf-8">

<title>石斑門</title>
<style>
:root{--gold:#e2b552;--text:#f3ead8;--muted:#b9ab90;--line:rgba(217,166,58,.35)}
html,body{margin:0;height:100%;background:#1b1712;color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#3a2f22 0%,#1b1712 70%)}
.box{width:min(340px,calc(100vw - 32px));padding:28px 24px;border:1px solid var(--line);border-radius:12px;background:rgba(28,24,20,.9);text-align:center}
h1{margin:0 0 6px;font-size:28px;color:var(--gold);font-family:"DFKai-SB","BiauKai","標楷體","KaiTi",serif;letter-spacing:4px}
p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.7}
input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:16px}
label{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px 0 4px;font-size:13px;color:var(--muted)}
button{width:100%;margin-top:12px;padding:10px;border:1px solid var(--gold);border-radius:8px;background:#b8862b;color:#fff;font:inherit;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#msg{min-height:20px;margin-top:10px;font-size:13px;color:#ff9a8a}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">

  <label><input type="checkbox" id="keep"> 在這台裝置記住</label>
  <button id="go">入　山</button>
  <div id="msg"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_STORE = 'shiban-key-' + P.s;            // 換密碼（換 salt）後，舊的記憶自動失效
async function deriveKey(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function openWith(key){
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.d));
  const html = new TextDecoder().decode(buf);
  document.open(); document.write(html); document.close();
}
async function tryRemembered(){
  let raw = null;
  try { raw = localStorage.getItem(KEY_STORE); } catch (e) {}
  if (!raw) return;
  try { await openWith(await crypto.subtle.importKey('raw', b64(raw), 'AES-GCM', false, ['decrypt'])); }
  catch (e) { try { localStorage.removeItem(KEY_STORE); } catch (e2) {} }
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  if (!window.crypto || !crypto.subtle){ msg.textContent = '這個瀏覽器不支援，請改用 Chrome、Edge 或 Safari 開啟'; return; }
  btn.disabled = true; msg.style.color = '#b9ab90'; msg.textContent = '結界解除中…';
  try {
    const key = await deriveKey(document.getElementById('pw').value);
    if (document.getElementById('keep').checked){
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      try { localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e) {}
    }
    await openWith(key);
  } catch (err) {
    btn.disabled = false; msg.style.color = '#ff9a8a'; msg.textContent = '口令錯誤，無法入山';
  }
};
tryRemembered();
