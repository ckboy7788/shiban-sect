<style>
:root{--gold:#e2b552;--text:#f3ead8;--muted:#b9ab90;--line:rgba(217,166,58,.35)}
html,body{margin:0;height:100%;background:#1b1712;color:var(--text);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 35%,#3a2f22 0%,#1b1712 70%)}
.box{width:min(340px,calc(100vw - 32px));padding:28px 24px;border:1px solid var(--line);border-radius:12px;background:rgba(28,24,20,.9);text-align:center;box-sizing:border-box}
h1{margin:0 0 6px;font-size:28px;color:var(--gold);font-family:"DFKai-SB","BiauKai","標楷體","KaiTi",serif;letter-spacing:4px}
p{margin:0 0 18px;font-size:13px;color:var(--muted);line-height:1.7}
button{width:100%;padding:10px;border-radius:8px;font:inherit;font-size:15px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#google{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid #dadce0;background:#fff;color:#3c4043;font-weight:bold}
#google svg{width:18px;height:18px}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:12px;color:var(--muted)}
.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--text);font:inherit;font-size:16px}
label{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0 2px;font-size:13px;color:var(--muted)}
#go{margin-top:10px;border:1px solid var(--gold);background:#b8862b;color:#fff}
#msg{min-height:20px;margin-top:12px;font-size:13px;color:#ff9a8a;line-height:1.6}
#msg a{color:var(--gold);cursor:pointer;text-decoration:underline}
</style>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const GUEST_STORE = 'shiban-guest-' + P.g.s;          // 換訪客口令（換 salt）後，舊的記憶自動失效
const msg = (t, err) => { $('msg').style.color = err ? '#ff9a8a' : '#b9ab90'; $('msg').innerHTML = t; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
let fb = null, launched = false;
try { firebase.initializeApp(CFG); fb = {auth: firebase.auth(), db: firebase.firestore()}; } catch (e) { $('google').disabled = true; }

async function openPage(rawKey, who){
  const key = await crypto.subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.i)}, key, b64(P.d)));
  if (launched) return;
  launched = true;
  window.SHIBAN_AUTH = who;
  document.open(); document.write(html); document.close();
}
async function guestKey(code){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  const wrap = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.g.s), iterations:P.g.n, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.g.i)}, wrap, b64(P.g.d)));
}
async function tryRememberedGuest(){
  let raw = null;
  try { raw = localStorage.getItem(GUEST_STORE); } catch (e) {}
  if (!raw) return;
  try { await openPage(b64(raw), {role:'guest'}); }
  catch (e) { try { localStorage.removeItem(GUEST_STORE); } catch (e2) {} }
}
window.shibanSwitch = () => { fb.auth.signOut().then(() => location.reload()); };

if (fb) fb.auth.onAuthStateChanged(async user => {
  if (launched) return;
  if (!user){ tryRememberedGuest(); return; }
  const email = (user.email || '').toLowerCase();
  msg('驗明正身中…');
  $('google').disabled = true;
  try {
    const master = MASTERS.includes(email);
    const me = await fb.db.collection('members').doc(email).get();
    if (!me.exists && !master) throw {code:'not-member'};
    const sec = await fb.db.collection('secrets').doc('site').get();
    if (!sec.exists) throw {code:'no-key'};
    const no = me.exists ? me.data().no : 0;
    await openPage(b64(sec.data().k), {role: master ? 'master' : 'member', no, uid:user.uid, email, db:fb.db, auth:fb.auth, firebase});
  } catch (e) {
    $('google').disabled = false;
    if (e && (e.code === 'not-member' || e.code === 'permission-denied'))
      msg('「' + esc(email) + '」不在 CK 探界學院名冊上。<br>請改用學校帳號，或<a onclick="shibanSwitch()">換一個帳號</a>', true);
    else if (e && e.code === 'no-key') msg('掌門尚未完成山門設定，請稍後再試', true);
    else msg('入山失敗：' + esc(e && (e.message || e.code) || e) + '<br><a onclick="shibanSwitch()">重新登入</a>', true);
  }
});

$('google').onclick = () => {
  if (!fb) return msg('無法連線到登入服務，請檢查網路', true);
  const prov = new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:'select_account'});
  fb.auth.signInWithPopup(prov).catch(e => {
    if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') fb.auth.signInWithRedirect(prov);
    else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') msg('登入失敗：' + esc(e.message), true);
  });
};
$('f').onsubmit = async e => {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle) return msg('這個瀏覽器不支援，請改用 Chrome、Edge 或 Safari 開啟', true);
  const btn = $('go'); btn.disabled = true; msg('結界解除中…');
  try {
    const k = await guestKey($('pw').value);
    if ($('keep').checked){ try { localStorage.setItem(GUEST_STORE, btoa(String.fromCharCode(...k))); } catch (e2) {} }
    await openPage(k, {role:'guest'});
  } catch (err) { btn.disabled = false; msg('口令錯誤，無法入山', true); }
};
if (!fb) tryRememberedGuest();
})();
</script>
